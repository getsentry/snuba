on:
  pull_request:
  push:
    branches:
      - master
      - release/**

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Job names stay build-amd64 / build-arm64 so craft's status contexts
  # do not need to change.
  build-multiplatform:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: amd64
          - os: ubuntu-24.04-arm
            platform: arm64
    runs-on: ${{ matrix.os }}
    name: build-${{ matrix.platform }}
    permissions:
      contents: read
      packages: write
    if: github.repository_owner == 'getsentry'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: getsentry/action-build-and-push-images@8a785ee066b116b5fbcad72237f4ea68471954ad
      with:
        image_name: 'snuba'
        platforms: linux/${{ matrix.platform }}
        dockerfile_path: 'Dockerfile'
        build_target: 'application'
        tag_suffix: -${{ matrix.platform }}
        ghcr: true
        tag_nightly: false
        tag_latest: false

  # Published to Google AR (amd64). gocd deploys and migrations pin
  # us-docker.pkg.dev/sentryio/snuba-mr/image:<sha>.
  build-production:
    runs-on: ubuntu-24.04
    name: Build and push production image
    permissions:
      contents: read
      id-token: write
    if: ${{ github.ref_name == 'master' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: getsentry/action-build-and-push-images@8a785ee066b116b5fbcad72237f4ea68471954ad
        with:
          image_name: 'snuba'
          platforms: linux/amd64
          dockerfile_path: './Dockerfile'
          build_target: 'application'
          ghcr: false
          tag_nightly: false
          tag_latest: false
          google_ar: true
          google_ar_image_name: us-docker.pkg.dev/sentryio/snuba-mr/image
          google_workload_identity_provider: projects/868781662168/locations/global/workloadIdentityPools/prod-github/providers/github-oidc-pool
          google_service_account: gha-gcr-push@sac-prod-sa.iam.gserviceaccount.com

  # Debug image — with busybox for troubleshooting
  build-debug-multiplatform:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: amd64
          - os: ubuntu-24.04-arm
            platform: arm64
    runs-on: ${{ matrix.os }}
    name: build-debug-${{ matrix.platform }}
    permissions:
      contents: read
      packages: write
    if: github.repository_owner == 'getsentry'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: getsentry/action-build-and-push-images@8a785ee066b116b5fbcad72237f4ea68471954ad
      with:
        image_name: 'snuba'
        platforms: linux/${{ matrix.platform }}
        dockerfile_path: 'Dockerfile'
        build_target: 'application-debug'
        tag_suffix: -debug-${{ matrix.platform }}
        ghcr: true
        tag_nightly: false
        tag_latest: false

  # Publishes the unsuffixed tags that everyone downstream consumes: self-hosted
  # (docker compose, the e2e job below) and craft, which retags <sha> into the
  # versioned release and :latest.
  assemble:
    needs: [build-multiplatform]
    if: ${{ (github.ref_name == 'master' || startsWith(github.ref_name, 'release/')) && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Docker Login
        run: docker login --username '${{ github.actor }}' --password-stdin ghcr.io <<< "$GHCR_TOKEN"
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Create multiplatform manifests
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/getsentry/snuba:${{ github.sha }} \
            --tag ghcr.io/getsentry/snuba:nightly \
            ghcr.io/getsentry/snuba:${{ github.sha }}-amd64 \
            ghcr.io/getsentry/snuba:${{ github.sha }}-arm64

  assemble-debug:
    needs: [build-debug-multiplatform]
    if: ${{ (github.ref_name == 'master' || startsWith(github.ref_name, 'release/')) && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Docker Login
        run: docker login --username '${{ github.actor }}' --password-stdin ghcr.io <<< "$GHCR_TOKEN"
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Create debug multiplatform manifests
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/getsentry/snuba:${{ github.sha }}-debug \
            --tag ghcr.io/getsentry/snuba:nightly-debug \
            ghcr.io/getsentry/snuba:${{ github.sha }}-debug-amd64 \
            ghcr.io/getsentry/snuba:${{ github.sha }}-debug-arm64

  # Exercises the unsuffixed <sha> tag against the real self-hosted docker
  # compose stack before craft can cut a release from it.
  self-hosted-end-to-end:
    needs: [build-multiplatform, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Run Sentry self-hosted e2e CI
        uses: getsentry/self-hosted@master
        with:
          project_name: snuba
          image_url: ghcr.io/getsentry/snuba:${{ github.sha }}
